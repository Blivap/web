name: CI

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["**"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-and-build:
    name: Lint, Typecheck, Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: yarn build
        env:
          # Same keys as local `.env` — set them in GitHub → Settings → Secrets and variables → Actions → Variables
          NEXT_PUBLIC_BASE_URL: ${{ vars.NEXT_PUBLIC_BASE_URL || 'https://blivap.com' }}
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL || 'https://api.ci.invalid' }}
          NEXT_PUBLIC_ENV: ${{ vars.NEXT_PUBLIC_ENV || 'test' }}
          NEXT_PUBLIC_ENABLE_NOTIFICATIONS: ${{ vars.NEXT_PUBLIC_ENABLE_NOTIFICATIONS || 'false' }}
          NEXT_PUBLIC_AUTH_TOKEN_KEY: ${{ vars.NEXT_PUBLIC_AUTH_TOKEN_KEY || 'auth_token' }}
          NEXT_PUBLIC_APP_NAME: ${{ vars.NEXT_PUBLIC_APP_NAME || 'Blivap' }}
